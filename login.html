<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BookNova - Login</title>
    <link rel ="stylesheet"href="login.css">
    <script src="login.js" defer></script>

</head>

<body>

    <div class="container">

        <div class="logo">BookNova</div>

        <div class="subtitle">
            Smart Library Management System
        </div>

        <h2>Login</h2>

        <div class="input-group">
            <label>Email / Username</label>

            <input
                type="text"
                id="email"
                placeholder="Enter your email or username"
            >
        </div>

        <div class="input-group">

            <label>Password</label>

            <div class="password-box">

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                >

                <span class="eye" onclick="togglePassword()">👁</span>

            </div>
        </div>

        <div class="forgot">
            <a href="#">Forgot Password?</a>
        </div>

        <button class="login-btn" onclick="login()">
            Login
        </button>

        <div id="message"></div>

        <div class="or">
            OR
        </div>

        <button class="google-btn" onclick="googleLogin()">
                 🔵 Continue with Google
        </button>

        <div class="register">
            Don't have an account?
            <a href="Register.html">Register</a>
        </div>

    </div>


    <script>

        function togglePassword() {

            const password =
                document.getElementById("password");

            if (password.type === "password") {

                password.type = "text";

            } else {

                password.type = "password";
            }
        }


        function login() {
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();
            const message = document.getElementById("message");

        if (email !== "" && password !== "") {
            message.style.color = "green";
            message.innerHTML = "Login successful!";
            window.location.href = "./home.html";
        } else {
            message.style.color = "red";
            message.innerHTML = "Please enter email and password.";
        }
    }
</script>
       
<script type="module">
  import { initializeApp } from
    "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

  import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup
  } from
    "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

  // Your BookNova Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyB9Fxj1dX1pHNRQbYNI6fIm4aTOC2Qe6hA",
    authDomain: "booknova-b49ae.firebaseapp.com",
    projectId: "booknova-b49ae",
    storageBucket: "booknova-b49ae.firebasestorage.app",
    messagingSenderId: "990019812270",
    appId: "1:990019812270:web:2fab81904454314b63e63f",
    measurementId: "G-QQ3DXZRDD5"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  // Real Google Sign-In
  window.googleLogin = async function () {
    const message = document.getElementById("message");

    message.style.color = "#4f46e5";
    message.textContent = "Connecting to Google...";

    try {
      const result = await signInWithPopup(auth, provider);
      const user = result.user;

      sessionStorage.setItem("booknovaUser", JSON.stringify({
        name: user.displayName,
        email: user.email,
        photo: user.photoURL
      }));

      window.location.href = "./home.html";

    } catch (error) {
      console.error("Google login error:", error);

      message.style.color = "red";

      if (error.code === "auth/popup-closed-by-user") {
        message.textContent = "Google sign-in was cancelled.";
      } else if (error.code === "auth/unauthorized-domain") {
        message.textContent =
          "This domain is not authorized in Firebase.";
      } else {
        message.textContent =
          "Google login failed: " + error.code;
      }
    }
  };
</script>

</body>
</html>
