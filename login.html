
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BookNova - Login</title>

    <link rel="stylesheet" href="login.css">

    <!-- Firebase Login JavaScript -->
    <script type="module" src="login.js"></script>
</head>

<body>

    <div class="container">

        <div class="logo">BookNova</div>

        <div class="subtitle">
            Smart Library Management System
        </div>

        <h2>Login</h2>

        <div class="input-group">
            <label>Email / Username</label>

            <input
                type="text"
                id="email"
                placeholder="Enter your email or username"
            >
        </div>

        <div class="input-group">

            <label>Password</label>

            <div class="password-box">

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                >

                <span
                    class="eye"
                    onclick="togglePassword()"
                >👁</span>

            </div>
        </div>

        <div class="forgot">
            <a href="#">Forgot Password?</a>
        </div>

        <!-- Normal Login Button -->
        <button
            class="login-btn"
            id="loginBtn"
            type="button"
        >
            Login
        </button>

        <div id="message"></div>

        <div class="or">
            OR
        </div>

        <!-- Google Login Button -->
        <button
            class="google-btn"
            id="googleBtn"
            type="button"
        >
            🔵 Continue with Google
        </button>

        <div class="register">
            Don't have an account?
            <a href="Register.html">Register</a>
        </div>

    </div>

</body>
</html>
