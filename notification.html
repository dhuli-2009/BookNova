<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BookNova - Notifications</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f7fb;
    color: #243247;
}

.container {
    max-width: 480px;
    min-height: 100vh;
    margin: auto;
    padding: 25px 20px 100px;
    background: white;
}

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 30px;
}

.header h1 {
    font-size: 25px;
    color: #2463eb;
}

.header p {
    margin-top: 6px;
    color: #7b8794;
    font-size: 13px;
}

.bell {
    font-size: 24px;
    background: #edf4ff;
    padding: 12px;
    border-radius: 50%;
}

.section {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
}

.section h3 {
    font-size: 17px;
}

#markAll {
    border: none;
    background: none;
    color: #2463eb;
    cursor: pointer;
    font-size: 13px;
}

#notificationList {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.notification {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 17px;
    border: 1px solid #e8edf5;
    border-radius: 14px;
    background: white;
}

.notification.unread {
    background: #f0f6ff;
    border-color: #d8e8ff;
}

.icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: #eaf2ff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
}

.content {
    flex: 1;
}

.content h4 {
    font-size: 14px;
    margin-bottom: 6px;
}

.content p {
    font-size: 13px;
    color: #748091;
    line-height: 1.5;
}

.empty {
    text-align: center;
    padding: 65px 15px;
}

.empty-icon {
    font-size: 55px;
    margin-bottom: 18px;
}

.empty h3 {
    margin-bottom: 10px;
    font-size: 18px;
}

.empty p {
    color: #8994a3;
    font-size: 14px;
    line-height: 1.6;
}

/* Bottom navigation */
.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 480px;
    background: white;
    display: flex;
    justify-content: space-around;
    padding: 13px 5px;
    border-top: 1px solid #e8edf5;
}

.bottom-nav a {
    text-decoration: none;
    color: #7c8795;
    font-size: 11px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
}

.bottom-nav a span {
    font-size: 20px;
}

.bottom-nav a.active {
    color: #2463eb;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div>
            <h1>Notifications 🔔</h1>
            <p>Stay updated with BookNova</p>
        </div>
        <div class="bell">🔔</div>
    </div>

    <div class="section">
        <h3>Recent Notifications</h3>
        <button id="markAll">Mark all as read</button>
    </div>

    <div id="notificationList"></div>

</div>

<div class="bottom-nav">
    <a href="index.html"><span>🏠</span>Home</a>
    <a href="search.html"><span>🔍</span>Search</a>
    <a href="my-library.html"><span>📚</span>My Library</a>
    <a href="profile.html"><span>👤</span>Profile</a>
</div>

<script>
const notificationList = document.getElementById("notificationList");
const API_URL = "https://booknova.onrender.com/api/login-activity";

let readNotifications = new Set();

function showEmptyState() {
    notificationList.innerHTML = `
        <div class="empty">
            <div class="empty-icon">🔔</div>
            <h3>No notifications yet</h3>
            <p>When there is an update to your books or library activity, notifications will appear here.</p>
        </div>
    `;
}

async function loadNotifications() {
    try {
        const response = await fetch(API_URL);
        const activities = await response.json();

        if (!response.ok || !Array.isArray(activities) || activities.length === 0) {
            showEmptyState();
            return;
        }

        notificationList.innerHTML = "";

        activities.forEach(activity => {
            const time = new Date(activity.logged_in_at);
            const notificationId = activity.full_name + time.getTime();

            const card = document.createElement("div");
            card.className = "notification";

            if (!readNotifications.has(notificationId)) {
                card.classList.add("unread");
            }

            card.innerHTML = `
                <div class="icon">👤</div>
                <div class="content">
                    <h4>${activity.full_name} logged in to BookNova</h4>
                    <p>${time.toLocaleString("en-IN")}</p>
                </div>
            `;

            card.addEventListener("click", function() {
                card.classList.remove("unread");
                readNotifications.add(notificationId);
            });

            notificationList.appendChild(card);
        });

    } catch (error) {
        console.error("Notification loading error:", error);
        notificationList.innerHTML = `
            <div class="empty">
                <div class="empty-icon">⚠️</div>
                <h3>Unable to load notifications</h3>
                <p>Please check your internet connection and try again.</p>
            </div>
        `;
    }
}

document.getElementById("markAll").addEventListener("click", function() {
    document.querySelectorAll(".notification.unread").forEach(card => {
        card.classList.remove("unread");
    });

    readNotifications = new Set(
        Array.from(document.querySelectorAll(".notification .content h4"))
            .map((heading, index) => {
                const activity = heading.textContent;
                const timeText = heading.nextElementSibling.textContent;
                return activity + new Date(timeText).getTime();
            })
    );
});

loadNotifications();

setInterval(loadNotifications, 5000);
</script>

</body>
</html>
