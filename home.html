<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookNova - Home</title>
  <link rel="stylesheet" href="home.css">
  <script src="home.js" defer></script>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">📘</span>
    <div>
      <h1>BookNova</h1>
      <p>Smart Library Management System</p>
    </div>
  </div>

  <div class="user-area">
    <button class="notification" id="notificationBtn" aria-label="Notifications">♧</button>
    <div class="avatar" id="avatar">U</div>
  </div>
</header>

<main class="container">

  <section class="welcome">
    <h2>Hello, <span id="userName">Reader</span> 👋</h2>
    <p>Discover your next favourite book today!</p>
  </section>

  <label class="search-box">
    <span>🔍</span>
    <input
      type="search"
      id="searchInput"
      placeholder="Search books, authors..."
      aria-label="Search books"
    >
  </label>

  <section class="stats">
    <div class="stat-card issued">
      <div>
        <p>Currently Issued</p>
        <h3>3</h3>
        <button class="text-btn" id="issuedBtn">View All →</button>
      </div>
      <span class="stat-icon">📚</span>
    </div>

    <div class="stat-card due">
      <div>
        <p>Due Today</p>
        <h3>1</h3>
        <button class="text-btn" id="dueBtn">View →</button>
      </div>
      <span class="stat-icon">📅</span>
    </div>
  </section>

  <section class="section">
    <div class="section-heading">
      <h2>Explore Library</h2>
    </div>

    <div class="shortcuts">
      <button class="shortcut" data-action="books">
        <span class="shortcut-icon">📖</span>
        <strong>All Books</strong>
      </button>

      <button class="shortcut" data-action="categories">
        <span class="shortcut-icon">▦</span>
        <strong>Categories</strong>
      </button>

      <button class="shortcut" data-action="library">
        <span class="shortcut-icon">📚</span>
        <strong>My Library</strong>
      </button>

      <button class="shortcut" data-action="reserve">
        <span class="shortcut-icon">▣</span>
        <strong>Reserve</strong>
      </button>
    </div>
  </section>

  <section class="section">
    <div class="section-heading">
      <h2>Recommended For You</h2>
      <button class="view-all" id="viewAllBtn">View All →</button>
    </div>

    <!-- Book categories will appear here -->
    <div
      id="categoryFilters"
      style="display:flex; flex-wrap:wrap; gap:10px; margin-bottom:20px;"
    ></div>

    <!-- The 8 PDF books will appear here automatically -->
    <div class="book-grid" id="bookGrid"></div>

    <p class="empty-message" id="emptyMessage" hidden>
      No books found. Try another search.
    </p>
  </section>

</main>

<nav class="bottom-nav">
  <button class="nav-item active" data-page="home">
    <span>⌂</span>Home
  </button>

  <button class="nav-item" data-page="search">
    <span>⌕</span>Search
  </button>

  <button class="nav-item" data-page="library">
    <span>📖</span>My Library
  </button>

  <button class="nav-item" data-page="profile">
    <span>♙</span>Profile
  </button>
</nav>

<div class="toast" id="toast" role="status"></div>

</body>
</html>
