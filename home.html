
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookNova - Home</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f7fb;
            color: #333;
        }
        header {
            background: #4f46e5;
            color: white;
            padding: 20px;
            text-align: center;
        }
        main {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            text-align: center;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #0001;
        }
        button {
            padding: 12px 22px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <h1>BookNova</h1>
        <p>Smart Library Management System</p>
    </header>

    <main>
        <div class="card">
            <h2>Welcome to BookNova!</h2>
            <p>Your library management dashboard is ready.</p>
            <button onclick="alert('Books section coming soon!')">
                Explore Books
            </button>
        </div>
    </main>
</body>
</html>
